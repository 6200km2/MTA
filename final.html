<!doctype html>
<html lang="sv" data-default-variant="4">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Larm och lås</title>
  <link rel="stylesheet" href="styles.css?v=20261111h" />
  <link rel="stylesheet" href="concept.css?v=20261113d" />
  <link rel="stylesheet" href="final.css?v=20261113l" />
</head>
<body>
  <!-- Final design after the user test (5 students, 2026-11-12), concept 4 (concept.js):
       - whole truck when all is fine (B: P3, P5), zooms into the cab when something needs a look (C: P1)
       - three icons with one word each (A: P1, P4); a time only on what is wrong, the rest in Historik
       - alarm in the picture only as waves when it is on; neutral reminder only when needed
       ?s=2 all locked + alarm on · ?window=open · ?truck=line · ?history=open · ?still=1 · ?theme=dark|light -->
  <div class="screen">
    <header class="app-bar">
      <nav class="nav-bar">
        <a class="icon-button" href="dashboard.html" aria-label="Tillbaka">
          <img src="assets/icons/chevron-left.svg" alt="" />
        </a>
        <h1 class="nav-bar__title">Larm och lås</h1>
        <img class="nav-bar__divider" src="assets/icons/divider-line-appbar.svg" alt="" />
      </nav>
    </header>
    <main class="content k-content" id="k-main"></main>

    <!-- History page: all events by day, newest first; alarms that went off stand out -->
    <section class="history-page" id="f-history-page" role="dialog" aria-modal="true" aria-labelledby="f-history-title" hidden>
      <nav class="nav-bar history-page__bar">
        <button class="icon-button" type="button" aria-label="Tillbaka" id="f-history-back">
          <img src="assets/icons/chevron-left.svg" alt="" />
        </button>
        <h2 class="nav-bar__title" id="f-history-title">Historik</h2>
        <img class="nav-bar__divider" src="assets/icons/divider-line-appbar.svg" alt="" />
      </nav>
      <div class="f-history" id="f-history"></div>
    </section>
  </div>

  <script src="concept.js?v=20261113d"></script>
</body>
</html>
